[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmanga"
version = "1.0.1"
description = "Educational terminal manga reader and downloader prototype"
authors = [{name = "Dave"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["manga", "cli", "reader", "downloader", "mangadex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "textual>=0.47.0",
    "platformdirs>=4.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
fastmanga = "fastmanga.cli.main:cli"
fmanga = "fastmanga.cli.main:cli"

[project.urls]
Homepage = "https://github.com/DaveR0b0t/fastmanga"
Repository = "https://github.com/DaveR0b0t/fastmanga"
Issues = "https://github.com/DaveR0b0t/fastmanga/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastmanga*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
